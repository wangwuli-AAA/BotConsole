name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        env:
          BOTCONSOLE_HOME: ${{ runner.temp }}\BotConsole-tests
        run: flutter test --no-pub
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version: (\S+)'
          $version = $match.Matches[0].Groups[1].Value.Split('+')[0]
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match pubspec.yaml version: v$version"
          }
      - name: Build Windows Release
        run: flutter build windows --release --no-pub
      - name: Verify resident memory budget
        shell: pwsh
        run: ./tool/verify_memory.ps1 -Exe build/windows/x64/runner/Release/bot_console.exe
      - name: Package portable app
        shell: pwsh
        run: |
          $source = 'build\windows\x64\runner\Release'
          foreach ($file in @('bot_console.exe', 'flutter_windows.dll', 'sqlite3.dll', 'data\flutter_assets\NativeAssetsManifest.json')) {
            if (!(Test-Path (Join-Path $source $file))) { throw "Missing release file: $file" }
          }
          New-Item -ItemType Directory -Path dist\BotConsole-windows-x64 -Force | Out-Null
          Copy-Item "$source\*" dist\BotConsole-windows-x64 -Recurse
          Copy-Item README.md,VALIDATION.md dist\BotConsole-windows-x64
          Compress-Archive -Path dist\BotConsole-windows-x64 -DestinationPath dist\BotConsole-windows-x64.zip
          $hash = (Get-FileHash dist\BotConsole-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BotConsole-windows-x64.zip" | Set-Content dist\SHA256SUMS.txt -Encoding ascii
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BotConsole-windows-x64
          path: |
            dist/BotConsole-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name BotConsole-windows-x64 --dir dist
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/BotConsole-windows-x64.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/BotConsole-windows-x64.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --verify-tag --title "BotConsole $env:GITHUB_REF_NAME" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
